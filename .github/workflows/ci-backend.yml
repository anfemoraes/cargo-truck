name: CI/CD Backend + Infra (Terraform)

on:
  push:
    branches: [ "dev", "main" ]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cargo-truck-backend:latest

jobs:
  # ------------------------------------------------------------------
  # 1. Testes do backend
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: senha
          POSTGRES_DB: cargo_truck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v3

      - name: 2. Preparar o ambiente Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: 3. Instalar SQLx CLI para o Banco de Dados
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: 4. Executar Migrations
        working-directory: ./backend
        run: sqlx migrate run
        env:
          DATABASE_URL: postgres://usuario:senha@localhost:5432/cargo_truck

      - name: 5. Rodar Testes Automatizados do Backend
        working-directory: ./backend
        run: cargo test
        env:
          DATABASE_URL: postgres://usuario:senha@localhost:5432/cargo_truck

  # ------------------------------------------------------------------
  # 2. Build e publicação da imagem
  # ------------------------------------------------------------------
  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicação da imagem Docker
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE }}

  # ------------------------------------------------------------------
  # 3. Terraform: garante que a infraestrutura na AWS existe
  # ------------------------------------------------------------------
  terraform:
    needs: build-and-push
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    outputs:
      instance_ip: ${{ steps.tf-outputs.outputs.instance_ip }}
      sg_id: ${{ steps.tf-outputs.outputs.sg_id }}

    steps:
      - uses: actions/checkout@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_ssh_public_key: ${{ secrets.TF_SSH_PUBLIC_KEY }}
          TF_VAR_ssh_allowed_cidr: ${{ secrets.TF_SSH_ALLOWED_CIDR }}
          TF_VAR_docker_compose_repo: https://github.com/${{ github.repository }}.git
          TF_VAR_git_branch: ${{ github.ref_name }}

      - name: Capturar outputs do Terraform
        id: tf-outputs
        run: |
          echo "instance_ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
          echo "sg_id=$(terraform output -raw security_group_id)" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # 4. Deploy
  # ------------------------------------------------------------------
  deploy:
    needs: terraform
    runs-on: ubuntu-latest

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      # ----------------------------------------------------------------
      # Autoriza temporariamente o IP do runner no Security Group
      # ----------------------------------------------------------------
      - name: Autorizar temporariamente o IP deste runner no Security Group
        id: authorize
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

          aws ec2 authorize-security-group-ingress \
            --group-id ${{ needs.terraform.outputs.sg_id }} \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32"

      # ----------------------------------------------------------------
      # Validação do par de chaves SSH
      #
      # Não imprime nenhuma chave.
      # Apenas compara os fingerprints.
      # ----------------------------------------------------------------
      - name: Validar par de chaves SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.TF_SSH_PUBLIC_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          echo "Fingerprint da chave pública do Terraform:"
          printf '%s\n' "$SSH_PUBLIC_KEY" | ssh-keygen -lf -

          echo "Fingerprint da chave pública derivada da chave privada do Deploy:"
          ssh-keygen -y -f /tmp/deploy_key | ssh-keygen -lf -

          DERIVED=$(ssh-keygen -y -f /tmp/deploy_key)
          PROVIDED=$(printf '%s\n' "$SSH_PUBLIC_KEY")

          if [ "$DERIVED" = "$PROVIDED" ]; then
            echo "OK: AWS_PRIVATE_KEY e TF_SSH_PUBLIC_KEY formam o mesmo par."
          else
            echo "ERRO: AWS_PRIVATE_KEY e TF_SSH_PUBLIC_KEY NÃO correspondem."
            exit 1
          fi

          rm -f /tmp/deploy_key

      # ----------------------------------------------------------------
      # Deploy via SSH
      # ----------------------------------------------------------------
      - name: Deploy via SSH (docker compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            sudo chown -R ubuntu:ubuntu /opt/cargo-truck
            git config --global --add safe.directory /opt/cargo-truck
            cd /opt/cargo-truck

            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} \
              --password-stdin

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull backend || true

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --build

      # ----------------------------------------------------------------
      # Revoga o acesso SSH do runner
      # ----------------------------------------------------------------
      - name: Revogar o acesso SSH do runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ needs.terraform.outputs.sg_id }} \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.authorize.outputs.runner_ip }}/32"